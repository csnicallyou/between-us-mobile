name: Mobile Next checks
on:
  push:
    paths: ['mobile-next/**', '.github/workflows/mobile-next-check.yml']
  pull_request:
    paths: ['mobile-next/**', '.github/workflows/mobile-next-check.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-next/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:all
