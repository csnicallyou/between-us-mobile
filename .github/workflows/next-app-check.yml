name: Next App checks
on:
  pull_request:
    paths:
      - 'next-app/**'
      - '.github/workflows/next-app-check.yml'
  push:
    branches:
      - planning/between-us-next
    paths:
      - 'next-app/**'
      - '.github/workflows/next-app-check.yml'
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck TypeScript
        run: npx tsc --noEmit
