name: Publish preview update

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - src/**
      - assets/**
      - app.json
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: eas-update-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Verify and publish iOS update
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Publish preview update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@21.7.1 update --channel preview --platform ios --non-interactive --message "GitHub ${GITHUB_SHA::7}"
