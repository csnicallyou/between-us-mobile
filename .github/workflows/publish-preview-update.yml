name: Publish preview update

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - src/**
      - assets/**
      - app.config.js
      - app.json
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: eas-update-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Verify and publish iOS update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_API_BASE_URL: https://186.246.45.4.nip.io:9444

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: |
          npm run typecheck
          npm run check:source

      - name: Run Expo diagnostics
        continue-on-error: true
        run: npm run doctor

      - name: Publish preview updates for every installed runtime
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for variant in default anton liza; do
            if [[ "$variant" == "default" ]]; then
              unset BUILD_VARIANT
            else
              export BUILD_VARIANT="$variant"
            fi
            npx --yes eas-cli@21.7.1 update \
              --channel preview \
              --platform ios \
              --non-interactive \
              --message "GitHub ${GITHUB_SHA::7} · ${variant}"
          done
