<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Между нами — Настройки</title>
<link rel="stylesheet" href="light.css">
<style>
html,body{width:390px}
body{font-family:'GolosText',system-ui,sans-serif}
.sheet{position:absolute;left:0;top:0;width:390px;padding:52px 20px 0;z-index:2}
.blk{position:relative}

/* ---- шапка вложенного экрана ---- */
.top{display:flex;align-items:center;gap:11px}
.rnd{
  position:relative;width:38px;height:38px;border-radius:19px;flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--t1);
  backdrop-filter:blur(7px) saturate(178%) brightness(1.02);
  -webkit-backdrop-filter:blur(7px) saturate(178%) brightness(1.02);
  background:rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 .5px rgba(255,255,255,.30), 0 2px 6px -2px rgba(60,50,84,.14);
}
.rnd svg{width:18px;height:18px}
.hd{flex:1;min-width:0}
.kicker{font-size:10px;font-weight:640;letter-spacing:.15em;text-transform:uppercase;color:var(--t3)}
.h1{font-size:26px;font-weight:600;letter-spacing:-.03em;color:var(--t1);margin-top:5px}

.sect{display:flex;align-items:center;gap:9px;margin:22px 2px 11px}
.sect span{font-size:10px;font-weight:640;letter-spacing:.16em;text-transform:uppercase;color:var(--t3)}
.sect::after{content:'';flex:1;height:1px;background:rgba(33,30,41,.10)}
.sect:first-of-type{margin-top:20px}

/* ---- строка настроек ---- */
.group{--r:24px;padding:6px}
.srow{
  display:flex;align-items:center;gap:13px;
  padding:11px 10px;border-radius:18px;
}
.srow + .srow{position:relative}
.srow + .srow::before{
  content:'';position:absolute;left:55px;right:10px;top:-1px;height:1px;
  background:rgba(33,30,41,.08);
}
.sicn{
  width:42px;height:42px;border-radius:14px;flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--t2);
  background:rgba(255,255,255,.20);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.30), inset 0 1px 0 rgba(255,255,255,.7);
}
.sicn svg{width:20px;height:20px}
.sicn--warn{color:#B5714F;background:rgba(216,150,110,.18)}
.sinfo{flex:1;min-width:0}
.stitle{font-size:15px;font-weight:600;letter-spacing:-.018em;color:var(--t1)}
.ssub{font-size:12px;font-weight:440;color:var(--t3);margin-top:3px;letter-spacing:-.004em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ssub--warn{color:#B5714F}
.sgo{color:var(--t3);flex:none}
.sgo svg{width:16px;height:16px;display:block}

/* ---- одиночная строка вне группы (диагностика) ---- */
.solo{--r:24px;padding:6px;margin-top:12px}

.foot{
  margin-top:26px;text-align:center;
  font-size:11.5px;font-weight:440;color:var(--t3);letter-spacing:-.004em;line-height:1.5;
}
</style>
</head>
<body>

<div class="sheet">

  <div class="top">
    <div class="rnd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></div>
    <div class="hd">
      <div class="kicker">Приложение</div>
      <div class="h1">Настройки</div>
    </div>
  </div>

  <div class="sect"><span>Пара</span></div>
  <div class="glass blk group">
    <div class="glass__lens"></div><div class="glass__tint"></div><div class="glass__rim"></div>
    <div class="glass__body">

      <div class="srow">
        <div class="sicn sicn--warn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.4"/><path d="M5 20c.6-4 3.3-6 7-6s6.4 2 7 6"/></svg>
        </div>
        <div class="sinfo">
          <div class="stitle">Аккаунт и пара</div>
          <div class="ssub ssub--warn">Подтвердите почту</div>
        </div>
        <div class="sgo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></div>
      </div>

      <div class="srow">
        <div class="sicn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 5.5-2 7-2 7h16s-2-1.5-2-7"/><path d="M10.3 19a1.8 1.8 0 0 0 3.4 0"/></svg>
        </div>
        <div class="sinfo">
          <div class="stitle">Уведомления</div>
          <div class="ssub">4 категории · 22:00–08:00</div>
        </div>
        <div class="sgo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></div>
      </div>

      <div class="srow">
        <div class="sicn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5c2.4 2.3 3.6 5.3 3.6 8.5S14.4 18.2 12 20.5M12 3.5c-2.4 2.3-3.6 5.3-3.6 8.5S9.6 18.2 12 20.5M4 12h16"/></svg>
        </div>
        <div class="sinfo">
          <div class="stitle">Фон и контраст</div>
          <div class="ssub">Свой цвет · #173246</div>
        </div>
        <div class="sgo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></div>
      </div>

      <div class="srow">
        <div class="sicn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11.5M8 12l4 4 4-4"/><path d="M5 16.5v2A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5v-2"/></svg>
        </div>
        <div class="sinfo">
          <div class="stitle">Экспорт данных</div>
          <div class="ssub">Нет активного запроса</div>
        </div>
        <div class="sgo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></div>
      </div>

    </div>
  </div>

  <div class="sect"><span>Служебное</span></div>
  <div class="glass blk solo">
    <div class="glass__lens"></div><div class="glass__tint"></div><div class="glass__rim"></div>
    <div class="glass__body">
      <div class="srow">
        <div class="sicn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 16v-5M12 8.2v.01"/></svg>
        </div>
        <div class="sinfo">
          <div class="stitle">Диагностика Liquid Glass</div>
          <div class="ssub">iOS 26.1 · нативное стекло активно</div>
        </div>
        <div class="sgo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></div>
      </div>
    </div>
  </div>

  <div class="foot">«Между нами» · версия 0.3.0</div>

</div>

<script src="glass.js"></script>
</body>
</html>
