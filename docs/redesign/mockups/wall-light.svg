<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 600" width="390" height="600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"    stop-color="#FAF6F2"/>
      <stop offset="0.38" stop-color="#F2EFF4"/>
      <stop offset="0.72" stop-color="#E9EEF3"/>
      <stop offset="1"    stop-color="#EFEBF2"/>
    </linearGradient>

    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0C9CE" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#F0C9CE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#BFD6EA" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#BFD6EA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sage" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C7DBCD" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#C7DBCD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cream" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6E3C4" stop-opacity="0.66"/>
      <stop offset="1" stop-color="#F6E3C4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lilac" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D8CFEC" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#D8CFEC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="s1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="390" height="600" fill="url(#base)"/>

  <!-- мягкие цветовые поля: пастель, низкая насыщенность -->
  <ellipse cx="70"  cy="70"  rx="210" ry="180" fill="url(#cream)"/>
  <ellipse cx="330" cy="130" rx="200" ry="190" fill="url(#blush)"/>
  <ellipse cx="120" cy="330" rx="215" ry="200" fill="url(#lilac)"/>
  <ellipse cx="350" cy="430" rx="205" ry="200" fill="url(#sky)"/>
  <ellipse cx="90"  cy="560" rx="200" ry="170" fill="url(#sage)"/>
  <ellipse cx="255" cy="290" rx="150" ry="140" fill="url(#glow)" opacity="0.55"/>

  <!-- бледное боке: даёт материалу что преломлять -->
  <g filter="url(#s1)">
    <circle cx="300" cy="82"  r="26" fill="#FFFFFF" opacity="0.72"/>
    <circle cx="58"  cy="196" r="18" fill="#FFFFFF" opacity="0.62"/>
    <circle cx="212" cy="150" r="12" fill="#FFF6E8" opacity="0.75"/>
    <circle cx="342" cy="330" r="21" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="150" cy="470" r="24" fill="#FFFFFF" opacity="0.60"/>
    <circle cx="46"  cy="392" r="13" fill="#FDF1F2" opacity="0.7"/>
    <circle cx="284" cy="520" r="15" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="196" cy="238" r="8"  fill="#FFFFFF" opacity="0.85"/>
    <circle cx="118" cy="112" r="9"  fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- очень тонкая горизонтальная структура -->
  <g opacity="0.32">
    <rect x="0" y="248" width="390" height="1" fill="#B9AEC6"/>
    <rect x="0" y="356" width="390" height="1" fill="#AEBCCB"/>
    <rect x="0" y="452" width="390" height="1" fill="#B4C4BC"/>
  </g>
</svg>
