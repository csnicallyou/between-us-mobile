<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 900" width="390" height="900" preserveAspectRatio="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0"    stop-color="#1B1B1B"/>
      <stop offset="0.30" stop-color="#131313"/>
      <stop offset="0.65" stop-color="#0D0D0D"/>
      <stop offset="1"    stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.24" r="0.75">
      <stop offset="0" stop-color="#2A2A2A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2A2A2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="s2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="390" height="900" fill="url(#base)"/>
  <ellipse cx="195" cy="200" rx="260" ry="220" fill="url(#vign)"/>

  <!-- едва заметные искры: монохром, ничего цветного -->
  <g filter="url(#s2)" opacity="0.8">
    <circle cx="72"  cy="120" r="1.6" fill="url(#spark)"/>
    <circle cx="298" cy="86"  r="2.1" fill="url(#spark)"/>
    <circle cx="216" cy="248" r="1.4" fill="url(#spark)"/>
    <circle cx="118" cy="356" r="1.8" fill="url(#spark)"/>
    <circle cx="330" cy="420" r="1.4" fill="url(#spark)"/>
    <circle cx="54"  cy="512" r="1.6" fill="url(#spark)"/>
    <circle cx="252" cy="588" r="1.3" fill="url(#spark)"/>
    <circle cx="160" cy="668" r="1.7" fill="url(#spark)"/>
    <circle cx="336" cy="742" r="1.4" fill="url(#spark)"/>
    <circle cx="88"  cy="812" r="1.6" fill="url(#spark)"/>
  </g>

  <!-- тончайшая горизонтальная структура, почти не видна -->
  <g opacity="0.16">
    <rect x="0" y="300" width="390" height="1" fill="#6A6A72"/>
    <rect x="0" y="520" width="390" height="1" fill="#5C5C64"/>
    <rect x="0" y="700" width="390" height="1" fill="#525258"/>
  </g>
</svg>
