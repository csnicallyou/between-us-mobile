pid /run/between-us-nginx/nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
  access_log off;
  server_tokens off;
  client_max_body_size 6m;

  server {
    listen 9444 ssl;
    listen [::]:9444 ssl;
    server_name 186.246.45.4.nip.io;

    ssl_certificate /etc/hysteria/acme/certificates/acme-v02.api.letsencrypt.org-directory/186.246.45.4.nip.io/186.246.45.4.nip.io.crt;
    ssl_certificate_key /etc/hysteria/acme/certificates/acme-v02.api.letsencrypt.org-directory/186.246.45.4.nip.io/186.246.45.4.nip.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BetweenUsTLS:1m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
      proxy_pass http://127.0.0.1:3100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
}
